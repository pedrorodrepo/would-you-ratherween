<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#120a1f">
    <title>Você prefere? Edição terror</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="app" id="app">
      <header>
        <span>&#128128; VOCÊ PREFERE?</span>
        <span id="counter"></span>
      </header>
      <div class="bar"><i id="progress"></i></div>

      <main>
        <button class="opt a" id="optA" aria-label="Opção A">
          <span class="txt"></span>
          <span class="pct"></span>
          <span class="sub"></span>
        </button>
        <div class="or">OU</div>
        <button class="opt b" id="optB" aria-label="Opção B">
          <span class="txt"></span>
          <span class="pct"></span>
          <span class="sub"></span>
        </button>
      </main>

      <footer>
        <button class="back" id="back">↶ Voltar</button>
        <span class="hint">Toque na sua escolha</span>
        <button class="next" id="next">Próxima →</button>
      </footer>

      <span class="ver">v2.0.1</span>
    </div>

    <div class="end" id="end">
      <div class="end-icon">&#127820;</div>
      <h2>Acabaram as perguntas!</h2>
      <p>Você respondeu todas. Quem teria sobrevivido?</p>
      <button id="restart">Jogar de novo</button>
      <button class="ghost" id="backEnd">↶ Mudar a última resposta</button>
    </div>

    <script src="config.js"></script>
    <script src="questions.js"></script>
    <script src="app.js"></script>
  </body>
</html>
